---
layout: default
---
<style>
  h1.site-title {
    font-size: 32px;
    font-weight: 300;
    color: #7a7468;
    letter-spacing: 5px;
    margin: 0;
    text-transform: uppercase;
  }
  .title-rule {
    width: 200px;
    margin: 10px 0 6px 0;
    border: none;
    border-top: 1px solid #b8b0a0;
    position: relative;
    height: 4px;
  }
  .title-rule::after {
    content: "";
    display: block;
    width: 200px;
    border-top: 1px solid #c8c0b4;
    position: absolute;
    bottom: 0;
  }
  .tagline {
    font-size: 11px;
    font-weight: 400;
    color: #9a9088;
    letter-spacing: 2px;
    margin: 0 0 20px 0;
    text-transform: lowercase;
  }
  h2 {
    font-size: 13px;
    font-weight: 600;
    color: #5a5550;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 24px 0 4px 0;
  }
  .section-ornament {
    color: #b8b0a0;
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 16px;
    line-height: 1;
  }
  ul.essay-list {
    list-style: none;
    padding: 0;
    margin: 0;
    border-left: 1px solid #d0c8b8;
    padding-left: 16px;
  }
  ul.essay-list li {
    margin-bottom: 5px;
    font-size: 14px;
    line-height: 1.6;
    padding-left: 16px;
    position: relative;
  }
  ul.essay-list li::before {
    content: "\25C7";
    position: absolute;
    left: -1px;
    top: 1px;
    font-size: 8px;
    color: #9a9088;
  }
  .page-end {
    margin-top: 48px;
  }
  .page-end::before {
    content: "";
    display: block;
    width: 80px;
    border-top: 1px solid #c8c0b0;
    margin-bottom: 8px;
  }
  .page-end-mark {
    color: #c0b8a8;
    font-size: 10px;
    letter-spacing: 6px;
  }
</style>

<h1 class="site-title">Ordinary Engineer</h1>
<hr class="title-rule">
<p class="tagline">stories from startups &amp; engineering</p>

<h2>Essays</h2>
<div class="section-ornament">&mdash; &middot; &mdash;</div>

<ul class="essay-list">
{% for essay in site.essays reversed %}

{% endfor %}
</ul>
