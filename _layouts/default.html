<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Ordinary Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, sans-serif;
      color: #3a3632;
      background: #f4f0e8;
      margin: 0;
      padding: 0;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(200,190,170,0.15) 0%, transparent 70%),
        radial-gradient(ellipse at 80% 20%, rgba(180,170,150,0.1) 0%, transparent 60%);
    }
    #wrapper {
      display: flex;
      min-height: 100vh;
    }
    #sidebar {
      width: 100px;
      padding: 20px 0;
      flex-shrink: 0;
      background: #ece8e0;
      border-right: 1px solid #c0b8a8;
      box-shadow: inset -3px 0 0 -2px #d8d0c4;
      position: relative;
    }
    #sidebar::before {
      content: "";
      position: absolute;
      right: 4px;
      top: 16px;
      bottom: 16px;
      width: 0;
      border-right: 1px solid #d0c8b8;
    }
    #sidebar a {
      display: block;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #6a6258;
      text-decoration: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 1px;
      position: relative;
    }
    #sidebar a:hover { color: #2a2420; }
    .sidebar-ornament {
      display: block;
      text-align: center;
      color: #c0b8a8;
      font-size: 9px;
      letter-spacing: 3px;
      margin: 12px 8px;
      border-top: 1px solid #d0c8b8;
      border-bottom: 1px solid #d0c8b8;
      padding: 3px 0;
      line-height: 1;
    }
    #main {
      padding: 36px 48px;
      max-width: 620px;
    }
    a {
      color: #3a3228;
      text-decoration: underline;
      text-decoration-color: #c8c0b0;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    a:visited { color: #7a7268; }
    a:hover {
      color: #1a1410;
      text-decoration-color: #8a8070;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="sidebar">
      <a href="{{ site.baseurl }}/">Essays</a>
      <a href="{{ site.baseurl }}/about">About</a>
      <span class="sidebar-ornament">///</span>
      <svg width="60" height="80" viewBox="0 0 60 80" fill="none" stroke="#b8ad9e" stroke-width="0.6" style="display:block;margin:16px auto 0;opacity:0.5">
        <path d="M16 12 Q10 8 14 4 Q18 2 20 6"/>
        <path d="M44 12 Q50 8 46 4 Q42 2 40 6"/>
        <rect x="18" y="10" width="24" height="3" rx="1"/>
        <line x1="22" y1="13" x2="22" y2="60"/>
        <line x1="28" y1="13" x2="28" y2="60"/>
        <line x1="32" y1="13" x2="32" y2="60"/>
        <line x1="38" y1="13" x2="38" y2="60"/>
        <rect x="16" y="60" width="28" height="3" rx="1"/>
        <rect x="14" y="63" width="32" height="4" rx="1"/>
      </svg>
    </div>
    <div id="main">
      {{ content }}
    </div>
  </div>
</body>
</html>
